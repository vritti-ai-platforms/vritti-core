packages:
  - apps/*
  - apps/micro-apps/*
  - apps/microservices/*
  - apps/web-mfs/*
  - e2e/*

nodeLinker: hoisted

onlyBuiltDependencies:
  - '@compodoc/compodoc'
  - '@nestjs/core'
  - '@scarf/scarf'
  - '@swc/core'
  - bcrypt
  - core-js
  - esbuild
  - nx
  - unrs-resolver

overrides:
  '@vritti/api-sdk': link:../api-sdk
  '@vritti/quantum-ui': link:../quantum-ui
  '@vritti/quantum-ui-native': link:../quantum-ui-native
  lightningcss: 1.30.1
