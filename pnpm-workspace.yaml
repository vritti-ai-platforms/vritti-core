packages:
  - apps/*
  - apps/micro-apps/*
  - apps/microservices/*
  - apps/web-mfs/*
  - e2e/*

nodeLinker: hoisted

onlyBuiltDependencies:
  - '@compodoc/compodoc'
  - '@nestjs/core'
  - '@scarf/scarf'
  - '@swc/core'
  - bcrypt
  - core-js
  - esbuild
  - nx
  - unrs-resolver

overrides:
  '@vritti/api-sdk': link:../api-sdk
  # '@vritti/quantum-ui': link:../quantum-ui
  '@vritti/quantum-ui-native': link:../quantum-ui-native
  lightningcss: 1.30.1
  # Force RN-0.83-compatible native-menu versions — zeego 3.0.6 pins pre-RN-0.81 versions
  # (react-native-ios-context-menu@3.1.0 / @react-native-menu/menu@1.2.2) that won't build on 0.83.
  react-native-ios-context-menu: 3.2.1
  react-native-ios-utilities: 5.2.0
  '@react-native-menu/menu': 2.0.0

patchedDependencies:
  '@gorhom/bottom-sheet@5.2.13': patches/@gorhom__bottom-sheet@5.2.13.patch
