name: Build & Push

# Auto-builds on merge to main via `nx affected`. Server images + web .tar.gz
# all land in GHCR; the manual Deploy workflow ships them to the VM.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: 'Build ALL apps (ignore nx affected)'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Reusable workflows can't request more than the caller grants. The backend-image
# and web reusables push to GHCR, so the caller must hold packages: write.
permissions:
  contents: read
  packages: write

jobs:
  affected:
    name: Detect affected apps
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.aff.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
      - id: aff
        run: |
          # Manual "Build ALL" toggle bypasses nx affected (forces every app to build).
          if [ "${{ inputs.all }}" = "true" ]; then
            PROJECTS=$(pnpm exec nx show projects --type app --json)
            echo "Forcing ALL apps: $PROJECTS"
          else
            PROJECTS=$(pnpm exec nx show projects --affected --type app --json)
            echo "Affected apps: $PROJECTS"
          fi
          echo "projects=$PROJECTS" >> "$GITHUB_OUTPUT"

  core-server:
    needs: affected
    if: contains(fromJSON(needs.affected.outputs.projects), 'vritti-core-server')
    uses: vritti-ai-platforms/infrastructure/.github/workflows/reusable-build-backend-image.yml@main
    with:
      service_name: core-server
      dockerfile_path: apps/core-server/Dockerfile
      build_context: .
      package_json_path: apps/core-server/package.json
    secrets: inherit

  commerce-service:
    needs: affected
    if: contains(fromJSON(needs.affected.outputs.projects), 'commerce-service')
    uses: vritti-ai-platforms/infrastructure/.github/workflows/reusable-build-backend-image.yml@main
    with:
      service_name: commerce-service
      dockerfile_path: apps/microservices/commerce-service/Dockerfile
      build_context: .
      package_json_path: apps/microservices/commerce-service/package.json
    secrets: inherit

  core-web:
    needs: affected
    if: contains(fromJSON(needs.affected.outputs.projects), 'vritti-core-web')
    uses: vritti-ai-platforms/infrastructure/.github/workflows/reusable-build-web.yml@main
    with:
      app_name: core-web
      build_command: pnpm exec nx build vritti-core-web
      output_dir: apps/core-web/dist
      package_json_path: apps/core-web/package.json
      # No mf_base_url: the HOST resolves remotes same-origin at runtime (window.location →
      # https://<current-host>/<prodPath>/mf-manifest.json), so one bundle serves every self-hosted
      # tenant subdomain. Baking a fixed origin would send all tenants' remotes to one central host.
    secrets: inherit

  # Module-federation remote — core-web loads it at runtime via the feature catalog
  commerce-mf:
    needs: affected
    if: contains(fromJSON(needs.affected.outputs.projects), 'commerce-mf')
    uses: vritti-ai-platforms/infrastructure/.github/workflows/reusable-build-web.yml@main
    with:
      app_name: commerce-mf
      build_command: pnpm exec nx build commerce-mf
      output_dir: apps/web-mfs/commerce-mf/dist
      package_json_path: apps/web-mfs/commerce-mf/package.json
      production_domain: https://dev.vrittiai.com
    secrets: inherit

  # Module-federation remote — core-web loads it at runtime via the feature catalog
  gitea-mf:
    needs: affected
    if: contains(fromJSON(needs.affected.outputs.projects), 'gitea-mf')
    uses: vritti-ai-platforms/infrastructure/.github/workflows/reusable-build-web.yml@main
    with:
      app_name: gitea-mf
      build_command: pnpm exec nx build gitea-mf
      output_dir: apps/web-mfs/gitea-mf/dist
      package_json_path: apps/web-mfs/gitea-mf/package.json
      production_domain: https://dev.vrittiai.com
    secrets: inherit
