[databases]
vritti_dev = host=210.79.128.240 port=5432 dbname=vritti_dev connect_query='SET search_path TO vritti_core'

[pgbouncer]
listen_port = 6432
listen_addr = 0.0.0.0
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
ignore_startup_parameters = extra_float_digits,search_path,options

; Transaction mode: connection returned to pool after each transaction.
; Compatible with SET LOCAL / set_config(..., true) used for RLS.
pool_mode = transaction

max_client_conn = 300
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

server_idle_timeout = 600
client_idle_timeout = 0
server_lifetime = 3600

; Quiet logs — disable per-connection noise
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
