# NATS Server Configuration — Vritti Core

# Listen on default port
port: 4222

# HTTP monitoring endpoint
http_port: 8222

# Server name
server_name: vritti-nats

# Logging
debug: false
trace: false
logtime: true

# Max payload size (1MB)
max_payload: 1048576

# Max connections
max_connections: 1024

# Client timeout — how long to wait for a client to send data
write_deadline: "10s"

# JetStream — persistent messaging (enable when needed for events)
# jetstream {
#   store_dir: "/data/nats"
#   max_mem: 256MB
#   max_file: 1GB
# }
