services:
  nats:
    image: nats:2.10-alpine
    container_name: vritti-nats
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf
    command: ["--config", "/etc/nats/nats.conf"]
    restart: unless-stopped
