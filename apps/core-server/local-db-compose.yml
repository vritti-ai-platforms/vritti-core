# Local dev backing services for core-server + commerce-service (the `local` env).
# Postgres + Redis + NATS on standard ports so PRIMARY_DB_HOST=localhost,
# REDIS_URL=redis://localhost:6379/0, NATS_URL=nats://localhost:4222 just work.
#   docker compose -f local-db-compose.yml up -d
# NOTE: throwaway local DB — run migrations to create the schema. Postgres 18 does NOT auto-upgrade
# an older data dir; if you had an old volume, `... down -v` first.
services:
  postgres:
    image: postgres:18
    container_name: vritti-core-postgres
    restart: unless-stopped
    environment:
      # Owner/superuser (bootstraps the DB, owns tables, runs migrations via DIRECT_URL).
      POSTGRES_USER: vritti_core_owner
      POSTGRES_PASSWORD: Vritti@0322
      POSTGRES_DB: vritti_local
    volumes:
      # Mount the PARENT, not .../data — postgres:18 refuses a volume mounted directly at the data dir.
      - pgdata:/var/lib/postgresql
      # Seeds the least-privilege runtime role (vritti_core_app) so RLS applies to app connections.
      # Runs ONCE on a fresh data dir — `down -v` if you had an old volume with the postgres superuser.
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      # Host 5433 (core) vs 5432 (cloud) so both projects' local stacks can run at once.
      - "5433:5432"
    healthcheck:
      # Lets gitea wait for a ready DB before it runs its first-boot migrations.
      test: ["CMD-SHELL", "pg_isready -U vritti_core_owner -d vritti_local"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8-alpine
    container_name: vritti-core-redis
    restart: unless-stopped
    ports:
      # Host 6380 (core) vs 6379 (cloud).
      - "6380:6379"

  # NATS — the commerce microservice talks to core-server over NATS (no HTTP).
  nats:
    image: nats:2.11-alpine
    container_name: vritti-core-nats
    restart: unless-stopped
    ports:
      - "4222:4222" # client connections
      - "8222:8222" # http monitoring

  # Gitea — self-hosted git service. Shares the core-server Postgres: same server, same
  # `vritti_local` DB, but connects as its OWN least-privilege `gitea` role and keeps its
  # tables in a dedicated `gitea` schema it owns — no access to core's `core`/`commerce`
  # schemas. The role + schema are created by init-db/02-gitea-schema.sql (Gitea creates
  # neither itself). On the compose network it reaches the DB at postgres:5432; core-server
  # (on the host) reaches Gitea's API at http://localhost:3020.
  gitea:
    image: gitea/gitea:1.23
    container_name: vritti-core-gitea
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: vritti_local
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: Vritti@0322
      GITEA__database__SSL_MODE: disable
      GITEA__database__SCHEMA: gitea
      GITEA__server__DOMAIN: localhost
      GITEA__server__HTTP_PORT: 3000
      GITEA__server__ROOT_URL: http://localhost:3020/
      GITEA__server__SSH_PORT: 2222
      # Skip the web installer — the DB + server config come entirely from these env vars.
      GITEA__security__INSTALL_LOCK: "true"
    volumes:
      - giteadata:/data
    ports:
      # Host 3020 (Gitea HTTP) — 3000/3001/3012 are taken by cloud/core-server/core-web.
      - "3020:3000"
      - "2222:22" # git-over-ssh

volumes:
  pgdata:
  giteadata:
